name: aghost

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    init: true
    command: ["pnpm", "--filter", "server", "dev"]
    environment:
      APP_URL: ${APP_URL:?Set APP_URL in the root .env}
      API_PORT: ${API_PORT:?Set API_PORT in the root .env}
      API_HOST: ${API_HOST:?Set API_HOST in the root .env}
      # This gateway is on the Docker network started by the Supabase CLI.
      SUPABASE_URL: http://supabase_kong_aghost:8000
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Run pnpm setup:local}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Run pnpm setup:local}
      ZERNIO_API_URL: ${ZERNIO_API_URL:?Set ZERNIO_API_URL in the root .env}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY-}
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET-}
      DODO_PAYMENTS_ENVIRONMENT: ${DODO_PAYMENTS_ENVIRONMENT:?Set DODO_PAYMENTS_ENVIRONMENT in the root .env}
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY-}
      DODO_PAYMENTS_WEBHOOK_KEY: ${DODO_PAYMENTS_WEBHOOK_KEY-}
      POSTHOG_KEY: ${POSTHOG_KEY-}
      POSTHOG_HOST: ${POSTHOG_HOST-}
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"
    volumes:
      - ./apps/server/src:/app/apps/server/src:ro
      - ./packages/api/src:/app/packages/api/src:ro
      - ./packages/supabase/src:/app/packages/supabase/src:ro
    networks:
      - supabase
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:' + process.env.API_PORT + '/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 6

  # Public HTTPS address for Zernio and Dodo Payments webhooks. Started only by
  # pnpm local:tunnel.
  tunnel:
    image: cloudflare/cloudflared:2026.7.2
    profiles: ["tunnel"]
    # --url selects a quick tunnel; the config's ingress rules decide routing.
    command:
      - tunnel
      - --metrics
      - 0.0.0.0:2000
      - --config
      - /etc/cloudflared/config.yml
      - --url
      - http://server:${API_PORT:?Set API_PORT in the root .env}
    configs:
      - source: tunnel
        target: /etc/cloudflared/config.yml
    # The script reads the random trycloudflare.com hostname from /quicktunnel.
    ports:
      - "127.0.0.1::2000"
    networks:
      - supabase
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 2s
      timeout: 5s
      retries: 30

configs:
  # Only the webhook endpoints are public; every other path is answered with 404.
  tunnel:
    content: |
      ingress:
        - path: ^/api/webhooks/(zernio|dodo)$$
          service: http://server:${API_PORT:?Set API_PORT in the root .env}
        - service: http_status:404

networks:
  supabase:
    external: true
    name: supabase_network_aghost
