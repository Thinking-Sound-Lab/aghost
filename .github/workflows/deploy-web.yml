name: Deploy web

# Builds apps/web on the runner and uploads the output to Vercel, so Vercel
# never builds from Git. The Vercel project's root directory is apps/web.
on:
  workflow_call:
    inputs:
      environment:
        description: Vercel environment and GitHub environment, production or preview.
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm install --global vercel@63.1.2

      - name: Pull project settings and ${{ inputs.environment }} variables
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --target="$TARGET" --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --target="$TARGET" --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
