name: Deploy API

# Applies pending Supabase migrations, then deploys the API's CDK stack to ECS.
# An unchanged image and stack make the deployment a no-op.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and CDK stage, for example production.
        type: string
        required: true

permissions:
  contents: read

jobs:
  migrate:
    name: Supabase migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL"

  deploy:
    name: ECS ${{ inputs.environment }}
    needs: migrate
    # Builds the Graviton image natively.
    runs-on: ubuntu-24.04-arm
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.API_DOMAIN_NAME }}/api/health
    permissions:
      contents: read
      id-token: write
    env:
      STAGE: ${{ inputs.environment }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_URL: ${{ vars.APP_URL }}
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy
        run: pnpm --filter infra exec cdk deploy "Aghost-$STAGE-Api" --require-approval never
