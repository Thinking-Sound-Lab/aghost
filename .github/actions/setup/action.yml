name: Set up the workspace
description: Installs pnpm and Node.js, then the workspace's dependencies.

runs:
  using: composite
  steps:
    # Installs the version in package.json's packageManager field.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # The API's container image runs Node.js 22.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
