name: Deploy the web app
description: >-
  Builds apps/web on the runner and uploads the output to Vercel, so Vercel
  never builds from Git. The Vercel project's root directory is apps/web.

inputs:
  target:
    description: The Vercel environment, production or preview.
    required: true
  org-id:
    description: The Vercel team's ID.
    required: true
  project-id:
    description: The Vercel project's ID.
    required: true
  token:
    description: A Vercel access token.
    required: true

outputs:
  url:
    description: The deployment's address.
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - shell: bash
      run: npm install --global vercel@63.1.2

    - name: Pull project settings and ${{ inputs.target }} variables
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

    - name: Build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: vercel build --target="$TARGET" --token="$VERCEL_TOKEN"

    - name: Deploy
      id: deploy
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: echo "url=$(vercel deploy --prebuilt --target="$TARGET" --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
